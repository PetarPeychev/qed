name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: laytan/setup-odin@v2
        with:
          release: dev-2026-05
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: ./build.sh

      - name: Test
        run: odin test src -collection:lib=lib

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-22.04
          - name: linux-arm64
            runner: ubuntu-22.04-arm
          - name: macos-arm64
            runner: macos-14
          - name: macos-amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: laytan/setup-odin@v2
        with:
          release: dev-2026-05
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        env:
          QED_VERSION: ${{ github.ref_name }}
        run: ./build.sh

      - name: Package
        run: |
          dir="qed-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir "$dir"
          cp qed LICENSE THIRD_PARTY_LICENSES.md README.md "$dir/"
          tar czf "$dir.tar.gz" "$dir"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: qed-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
